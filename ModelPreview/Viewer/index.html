<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 模型预览</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js",
    "three/addons/": "./lib/addons/"
  }
}
</script>
</head>
<body data-theme="dark">
<div id="app">
  <!-- ============ 顶栏 ============ -->
  <header id="topbar">
    <div class="tb-group">
      <button class="tbtn" id="tb-open" title="打开模型文件（本地解析，不上传）">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button class="tbtn" id="tb-append" title="合并打开：将模型追加到当前场景">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>合并</span>
      </button>
      <button class="tbtn" id="tb-reset-scene" title="场景重置：清空所有已加载模型">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      </button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="tbtn" id="tb-reset-view" title="重置视角（相机自动归位）">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button class="tbtn text" id="tb-cam-kind" title="透视 / 正交投影切换">正交</button>
      <button class="tbtn" id="tb-turntable" title="自动转盘（鼠标交互时自动暂停）">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="tbtn" id="tb-snapshot" title="保存当前视角快照（可在右侧面板恢复）">
        <svg viewBox="0 0 24 24"><path d="M5 4h11l3 4v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M9 13l2 2 4-4"/></svg>
      </button>
      <button class="tbtn" id="tb-export-glb" title="导出优化 GLB（当前场景，可含网格合并）">
        <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <button class="tbtn" id="tb-embed" title="复制网页嵌入代码（model-viewer iframe 模板）">
        <svg viewBox="0 0 24 24"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13 6l-2 12"/></svg>
      </button>
    </div>
    <div class="tb-spacer"></div>
    <div class="tb-group">
      <button class="tbtn" id="tb-left-panel" title="显示 / 关闭左侧面板">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <button class="tbtn" id="tb-right-panel" title="显示 / 关闭右侧面板">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
      </button>
      <button class="tbtn" id="tb-shot" title="导出截图：相机视角高分辨率 PNG（自动隐藏网格，可选透明背景）">
        <svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h2l2-2h4l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <button class="tbtn" id="tb-theme" title="切换浅色 / 深色模式">
        <svg id="icon-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <!-- ============ 主区域 ============ -->
  <div id="main">
    <!-- 左面板：显示 / 背景 / 后处理 -->
    <aside id="left-panel" class="panel">
      <div class="panel-scroll">
      <div class="card">
        <div class="card-title">渲染模式</div>
        <div class="mode-grid" id="tb-shading">
          <button class="mode-card active" data-mode="shaded" title="PBR 实体渲染">
            <div class="m-title">着色</div><div class="m-sub">PBR 实体</div>
          </button>
          <button class="mode-card" data-mode="normal" title="顶点法线显示">
            <div class="m-title">法线</div><div class="m-sub">Normals</div>
          </button>
          <button class="mode-card" data-mode="wire" title="线框显示">
            <div class="m-title">线框</div><div class="m-sub">Wireframe</div>
          </button>
          <button class="mode-card" data-mode="xray" title="X 光透视">
            <div class="m-title">X 光</div><div class="m-sub">X-Ray</div>
          </button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">显示</div>
        <div class="row"><label for="opt-ground">地面</label><label class="toggle"><input type="checkbox" id="opt-ground"><span class="knob"></span></label></div>
        <div class="row"><label for="opt-grid">网格线</label><label class="toggle"><input type="checkbox" id="opt-grid" checked><span class="knob"></span></label></div>
        <div class="row"><label for="opt-axes">坐标轴</label><label class="toggle"><input type="checkbox" id="opt-axes"><span class="knob"></span></label></div>
        <div class="row"><label for="opt-shadow">地面阴影</label><label class="toggle"><input type="checkbox" id="opt-shadow"><span class="knob"></span></label></div>
        <div class="row"><label for="opt-edges">边界边</label><label class="toggle"><input type="checkbox" id="opt-edges"><span class="knob"></span></label></div>
        <div class="slider-row" id="ground-height-row" style="display:none"><span class="lbl">地面高度</span><input type="range" id="sl-ground-h" min="-20" max="60" value="0"><span class="val" id="v-ground-h">0</span></div>
        <div class="row" style="margin-top:6px"><span style="font-size:11.5px;color:var(--text-dim)">地面颜色</span></div>
        <div class="swatches" id="ground-colors">
          <button class="gswatch active" data-c="#f2f3f5" style="background:#f2f3f5" title="雪地 / 白"></button>
          <button class="gswatch" data-c="#6f9e58" style="background:#6f9e58" title="草地"></button>
          <button class="gswatch" data-c="#dcc9a0" style="background:#dcc9a0" title="沙地"></button>
          <button class="gswatch" data-c="#454a52" style="background:#454a52" title="公路（沥青）"></button>
          <button class="gswatch" data-c="#b8b6ae" style="background:#b8b6ae" title="混凝土"></button>
          <button class="gswatch" data-c="#26282e" style="background:#26282e" title="深色"></button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">视图预设</div>
        <div class="seg" id="view-presets">
          <button data-v="front" title="前视图">前</button>
          <button data-v="back" title="后视图">后</button>
          <button data-v="left" title="左视图">左</button>
          <button data-v="right" title="右视图">右</button>
          <button data-v="top" title="顶视图">顶</button>
          <button data-v="bottom" title="底视图">底</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">背景 <button class="mini-btn" id="bg-reset" title="恢复默认背景（跟随主题）">重置</button></div>
        <div class="seg" id="bg-mode">
          <button data-bg="theme" class="active" title="跟随界面主题">主题</button>
          <button data-bg="gradient" title="渐变背景">渐变</button>
          <button data-bg="transparent" title="透明背景（导出 PNG 亦透明）">透明</button>
        </div>
        <div class="row" style="margin-top:8px"><label for="opt-transparent-shot">截图透明背景</label><label class="toggle"><input type="checkbox" id="opt-transparent-shot"><span class="knob"></span></label></div>
        <div class="swatches" style="margin-top:9px">
          <button class="swatch active" data-bg="dark" title="深色背景"></button>
          <button class="swatch" data-bg="light" title="浅色背景"></button>
          <button class="swatch" data-bg="studio" title="摄影棚背景"></button>
          <button class="swatch" data-bg="sky" title="天空背景"></button>
          <button class="swatch" data-bg="white" title="纯白背景"></button>
          <button class="swatch" data-bg="black" title="纯黑背景"></button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">渲染调节 <button class="mini-btn" id="render-reset" title="恢复默认（曝光 1.0 / 环境 1.0）">重置</button></div>
        <div class="slider-row"><span class="lbl">曝光</span><input type="range" id="sl-exposure" min="20" max="250" value="100"><span class="val" id="v-exposure">1.0</span></div>
        <div class="slider-row"><span class="lbl">环境</span><input type="range" id="sl-env" min="0" max="250" value="20"><span class="val" id="v-env">0.2</span></div>
      </div>
      <div class="card collapsible collapsed" id="ql-settings-card">
        <div class="card-title" id="ql-settings-toggle" title="展开 / 折叠">空格预览设置 <span class="twist" id="ql-settings-twist">▶</span></div>
        <div class="card-body">
        <div class="row"><label for="set-ql-ground" title="无地面模型自动补地面">自动补地面</label><label class="toggle"><input type="checkbox" id="set-ql-ground" checked><span class="knob"></span></label></div>
        <div class="row"><span style="font-size:11.5px;color:var(--text-dim)">补地面颜色</span></div>
        <div class="swatches" id="ql-ground-colors">
          <button class="gswatch active" data-c="#ffffff" style="background:#ffffff" title="白"></button>
          <button class="gswatch" data-c="#e9ecf1" style="background:#e9ecf1" title="浅灰"></button>
          <button class="gswatch" data-c="#454a52" style="background:#454a52" title="深灰"></button>
        </div>
        <div class="row" style="margin-top:4px"><label for="set-ql-hidebackdrop">隐藏巨大背景面</label><label class="toggle"><input type="checkbox" id="set-ql-hidebackdrop" checked><span class="knob"></span></label></div>
        <div style="font-size:10.5px;color:var(--text-faint);line-height:1.5;margin-top:4px">以上设置对「选中预览 / 空格预览」生效，保存在本机。</div>
        </div>
      </div>
      </div>
    </aside>

    <!-- 视口 -->
    <div id="viewport">
      <div id="loading" class="hidden">
        <div class="spinner"></div>
        <div id="loading-text">正在加载模型…</div>
        <div id="progress-wrap" class="hidden"><div id="progress-bar"></div></div>
      </div>
      <div id="drop-hint"><div style="font-size:34px">⬇︎</div><div>松开以打开模型文件</div></div>
      <div id="error-panel" class="hidden">
        <div style="font-size:28px;margin-bottom:8px">⚠️</div>
        <div id="error-title">无法加载模型</div>
        <div id="error-detail"></div>
      </div>
      <div id="hud">左键旋转 · 滚轮缩放 · 右键平移 · 点击部件可选中</div>
      <div id="toast"></div>
    </div>

    <!-- 右面板：信息 / 统计 / 结构树 / 快照 -->
    <aside id="right-panel" class="panel">
      <div class="panel-scroll">
      <div id="file-section" class="card hidden">
        <div id="file-name">—</div>
        <div id="file-meta"><span id="file-format" class="badge">—</span><span id="file-size">—</span></div>
        <div id="file-note" class="hidden"></div>
      </div>
      <div class="card">
        <div class="card-title">模型信息</div>
        <div class="stats-grid">
          <div class="stat"><span class="stat-label">顶点</span><span class="stat-value" id="st-vertices">—</span></div>
          <div class="stat"><span class="stat-label">三角面</span><span class="stat-value" id="st-triangles">—</span></div>
          <div class="stat"><span class="stat-label">网格</span><span class="stat-value" id="st-meshes">—</span></div>
          <div class="stat"><span class="stat-label">材质</span><span class="stat-value" id="st-materials">—</span></div>
          <div class="stat wide"><span class="stat-label">尺寸</span><span class="stat-value" id="st-size">—</span></div>
          <div class="stat"><span class="stat-label">动画</span><span class="stat-value" id="st-animations">—</span></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">结构树</div>
        <div id="tree"><div class="tree-empty">加载模型后显示场景层级</div></div>
      </div>
      <div class="card">
        <div class="card-title">视角快照 <button class="mini-btn" id="snap-save" title="保存当前相机视角">＋ 保存当前</button></div>
        <div id="snap-list"><div class="tree-empty">暂无快照</div></div>
      </div>
      </div>
    </aside>
  </div>

  <!-- ============ 状态栏 ============ -->
  <footer id="statusbar">
    <span id="sb-ground" style="display:none"></span>
    <span id="sb-stats">— tris · — meshes</span>
    <span class="sb-spacer"></span>
    <span id="sb-hint">drag to rotate · scroll to zoom · click to select</span>
  </footer>
  <div id="ground-note-el" style="display:none"></div>

  <!-- ============ 动画条 ============ -->
  <footer id="animbar">
    <button id="anim-play" title="播放 / 暂停">
      <svg id="ic-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
      <svg id="ic-pause" viewBox="0 0 24 24" style="display:none"><path d="M7 4h4v16H7zM14 4h4v16h-4z"/></svg>
    </button>
    <span id="anim-name">—</span>
    <select id="anim-clip" title="选择动画片段"></select>
    <input type="range" id="anim-time" min="0" max="1000" value="0" title="动画进度">
    <span id="anim-clock">0.00 / 0.00s</span>
    <span id="anim-speed">速度 <select id="anim-speed-sel"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select></span>
    <span id="anim-loop">循环 <input type="checkbox" id="anim-loop-chk" checked></span>
  </footer>
</div>

<!-- 模态 -->
<div id="modal-back">
  <div id="modal">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div id="modal-actions">
      <button id="modal-cancel">取消</button>
      <button id="modal-ok">确定</button>
    </div>
  </div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
