<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>body{margin:0;background:#222}#c{width:100%;height:100vh}</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
</head><body>
<div id="c"></div>
<script type="module">
import * as THREE from 'three';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('c').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);
const cam = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
cam.position.set(3, 4, 5); cam.lookAt(0, 0, 0);
const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(4, 8, 5);
light.castShadow = true;
light.shadow.mapSize.set(2048, 2048);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const sphere = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16), new THREE.MeshStandardMaterial({ color: 0xcc4444 }));
sphere.position.y = 1; sphere.castShadow = true;
scene.add(sphere);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0xffffff }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
scene.add(ground);
(function loop(){ requestAnimationFrame(loop); renderer.render(scene, cam); })();
</script>
</body></html>
